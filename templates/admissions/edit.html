{% extends "base.html" %}
{% block title %}Edit Admission - Prerna Abhyasika{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{{ url_for('admissions.index') }}" class="btn btn-outline-secondary btn-sm me-3">
    <i class="fas fa-arrow-left"></i>
  </a>
  <h3 class="mb-0">Edit Admission - {{ member.member_code }}</h3>
</div>

<div class="card shadow-sm" style="max-width:760px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Full Name <span class="text-danger">*</span></label>
          <input type="text" name="full_name" class="form-control" value="{{ form.get('full_name','') }}" required maxlength="120" pattern="[A-Za-z .'-]+">
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone <span class="text-danger">*</span></label>
          <input type="text" name="phone" class="form-control" value="{{ form.get('phone','') }}" required maxlength="30" inputmode="numeric" pattern="\d+">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" name="email" class="form-control" value="{{ form.get('email','') }}" required maxlength="120">
        </div>
        <div class="col-md-6">
          <label class="form-label">Aadhaar Number <span class="text-danger">*</span></label>
          <input type="text" name="aadhaar_number" class="form-control" value="{{ form.get('aadhaar_number','') }}" required minlength="12" maxlength="12" pattern="\d{12}">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Date of Birth <span class="text-danger">*</span></label>
          <input type="text" id="dob_input" name="date_of_birth" class="form-control" value="{{ form.get('date_of_birth','') }}" placeholder="dd.mm.yyyy" inputmode="numeric" pattern="\d{2}[./]\d{2}[./]\d{4}" title="Use format dd.mm.yyyy." required>
        </div>
        <div class="col-md-2">
          <label class="form-label">Age</label>
          <input type="text" id="age_preview" class="form-control" readonly placeholder="Auto">
        </div>
        <div class="col-md-3">
          <label class="form-label">Gender <span class="text-danger">*</span></label>
          <select name="gender" class="form-select" required>
            <option value="" {% if not form.get('gender') %}selected{% endif %}>Select</option>
            <option value="Male" {% if form.get('gender') == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if form.get('gender') == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if form.get('gender') == 'Other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label">Lab <span class="text-danger">*</span></label>
          <select name="lab" class="form-select" required>
            <option value="" {% if not form.get('lab') %}selected{% endif %}>Select</option>
            <option value="Lab 1" {% if form.get('lab') == 'Lab 1' %}selected{% endif %}>Lab 1</option>
            <option value="Lab 2" {% if form.get('lab') == 'Lab 2' %}selected{% endif %}>Lab 2</option>
          </select>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">School Name <span class="text-danger">*</span></label>
          <input type="text" name="school_name" class="form-control" value="{{ form.get('school_name','') }}" required maxlength="120">
        </div>
        <div class="col-md-6">
          <label class="form-label">Status <span class="text-danger">*</span></label>
          <select name="membership_status" class="form-select" required>
            <option value="Active" {% if form.get('membership_status') == 'Active' %}selected{% endif %}>Active</option>
            <option value="Expired" {% if form.get('membership_status') == 'Expired' %}selected{% endif %}>Expired</option>
            <option value="Deleted" {% if form.get('membership_status') == 'Deleted' %}selected{% endif %}>Deleted</option>
          </select>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Emergency Contact Name <span class="text-danger">*</span></label>
          <input type="text" name="emergency_contact_name" class="form-control" value="{{ form.get('emergency_contact_name','') }}" required maxlength="120" pattern="[A-Za-z .'-]+">
        </div>
        <div class="col-md-6">
          <label class="form-label">Emergency Contact Number <span class="text-danger">*</span></label>
          <input type="text" name="emergency_contact_number" class="form-control" value="{{ form.get('emergency_contact_number','') }}" required maxlength="30" inputmode="numeric" pattern="\d+">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Address <span class="text-danger">*</span></label>
        <textarea name="address" class="form-control" rows="2" required maxlength="255">{{ form.get('address','') }}</textarea>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Membership Start Date</label>
          <input type="text" name="membership_start_date" class="form-control" value="{{ form.get('membership_start_date','') }}" placeholder="yyyy.mm.dd" inputmode="numeric" pattern="\d{4}\.\d{2}\.\d{2}" title="Use format yyyy.mm.dd.">
        </div>
        <div class="col-md-6">
          <label class="form-label">Membership End Date</label>
          <input type="text" name="membership_end_date" class="form-control" value="{{ form.get('membership_end_date','') }}" placeholder="yyyy.mm.dd" inputmode="numeric" pattern="\d{4}\.\d{2}\.\d{2}" title="Use format yyyy.mm.dd.">
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('admissions.index') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    const dobInput = document.getElementById('dob_input');
    const agePreview = document.getElementById('age_preview');
    if (!dobInput || !agePreview) return;

    const today = new Date();

    function parseDob(value) {
      const match = /^(\d{2})[./](\d{2})[./](\d{4})$/.exec((value || '').trim());
      if (!match) return null;
      const day = Number(match[1]);
      const month = Number(match[2]);
      const year = Number(match[3]);
      const parsed = new Date(year, month - 1, day);
      if (
        Number.isNaN(parsed.getTime()) ||
        parsed.getFullYear() !== year ||
        parsed.getMonth() !== month - 1 ||
        parsed.getDate() !== day
      ) {
        return null;
      }
      return parsed;
    }

    function refreshAge() {
      if (!dobInput.value) {
        agePreview.value = '';
        dobInput.setCustomValidity('');
        return;
      }

      const dob = parseDob(dobInput.value);
      if (!dob) {
        dobInput.setCustomValidity('Use format dd.mm.yyyy.');
        agePreview.value = '';
        return;
      }

      if (dob > today) {
        dobInput.setCustomValidity('Date of birth cannot be in the future.');
        agePreview.value = '';
        return;
      }
      dobInput.setCustomValidity('');

      let years = today.getFullYear() - dob.getFullYear();
      const monthDiff = today.getMonth() - dob.getMonth();
      const dayDiff = today.getDate() - dob.getDate();
      if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
        years -= 1;
      }
      agePreview.value = years >= 0 ? String(years) : '';
    }

    dobInput.addEventListener('input', refreshAge);
    refreshAge();
  })();
</script>
{% endblock %}
